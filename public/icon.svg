<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Deep slate/obsidian background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- Neon Teal to Royal Blue -->
    <linearGradient id="leg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    
    <!-- Neon Purple to Hot Pink -->
    <linearGradient id="leg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <!-- Silver/Glass crossbar -->
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    
    <!-- Glow effect for that modern cyberpunk/AI feel -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base container -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" />

  <!-- The stylized "A" Agent icon -->
  <g filter="url(#glow)">
    <!-- Floating AI Core (Dot above the A) -->
    <circle cx="256" cy="100" r="22" fill="#ffffff" opacity="0.95" />
    
    <!-- Crossbar of the A -->
    <rect x="165" y="260" width="182" height="48" rx="24" fill="url(#bar)" opacity="0.9" />
    
    <!-- Left Leg -->
    <rect x="226" y="130" width="60" height="260" rx="30" fill="url(#leg1)" transform="rotate(-25, 256, 150)" opacity="0.9" />
    
    <!-- Right Leg -->
    <rect x="226" y="130" width="60" height="260" rx="30" fill="url(#leg2)" transform="rotate(25, 256, 150)" opacity="0.9" />
  </g>
</svg>
